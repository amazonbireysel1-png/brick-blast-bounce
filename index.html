. Each hit lowers the number on a block by one.","Al levantar el dedo, las bolas salen una a una. Cada golpe resta uno al n\xFAmero del bloque.","Ao levantar o dedo, as bolas saem uma a uma. Cada batida reduz o n\xFAmero do bloco em um.","Hebst du den Finger, werden die B\xE4lle nacheinander abgefeuert. Jeder Treffer senkt die Zahl auf dem Block um eins.","Quand tu l\xE8ves le doigt, les balles partent une \xE0 une. Chaque impact retire un point au bloc.","\u041A\u043E\u0433\u0434\u0430 \u043E\u0442\u043F\u0443\u0441\u0442\u0438\u0448\u044C \u043F\u0430\u043B\u0435\u0446, \u0448\u0430\u0440\u044B \u0432\u044B\u043B\u0435\u0442\u0430\u044E\u0442 \u043F\u043E \u043E\u0447\u0435\u0440\u0435\u0434\u0438. \u041A\u0430\u0436\u0434\u043E\u0435 \u043F\u043E\u043F\u0430\u0434\u0430\u043D\u0438\u0435 \u0443\u043C\u0435\u043D\u044C\u0448\u0430\u0435\u0442 \u0447\u0438\u0441\u043B\u043E \u043D\u0430 \u0431\u043B\u043E\u043A\u0435 \u043D\u0430 \u0435\u0434\u0438\u043D\u0438\u0446\u0443.","Saat jari diangkat, bola ditembakkan satu per satu. Setiap tabrakan mengurangi angka pada balok satu."],["3. +1 toplar\u0131n\u0131 topla","3. Collect +1 balls","3. Recoge bolas +1","3. Colete bolas +1","3. Sammle +1-B\xE4lle","3. Ramasse les balles +1","3. \u0421\u043E\u0431\u0438\u0440\u0430\u0439 \u0448\u0430\u0440\u044B +1","3. Kumpulkan bola +1"],["Ye\u015Fil +1 halkalar\u0131na top de\u011Fdirirsen daha \xE7ok topun olur. K\xF6\u015Fesinde renkli rozet olan blok k\u0131r\u0131l\u0131nca g\xFC\xE7 d\xFC\u015F\xFCr\xFCr.","Touch the green +1 rings to get more balls. Blocks with a coloured badge in the corner drop a power-up when broken.","Toca los aros verdes +1 para tener m\xE1s bolas. Los bloques con una insignia de color en la esquina sueltan un poder al romperse.","Toque nos an\xE9is verdes +1 para ter mais bolas. Blocos com um emblema colorido no canto soltam um poder ao quebrar.","Ber\xFChre die gr\xFCnen +1-Ringe f\xFCr mehr B\xE4lle. Bl\xF6cke mit farbigem Abzeichen lassen beim Zerb
